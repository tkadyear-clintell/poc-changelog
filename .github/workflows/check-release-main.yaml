name: Validate Source Branch
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - dev

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch pattern
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          if [[ "$TARGET_BRANCH" != "main" ]]; then
            echo "✓ PR targets '$TARGET_BRANCH', no source branch restriction."
            exit 0
          fi
          SOURCE_BRANCH="${{ github.head_ref }}"
          PATTERN="^(dev|hotfix\/.*)$"                
          if [[ ! $SOURCE_BRANCH =~ $PATTERN ]]; then
            echo "Error: The source branch '$SOURCE_BRANCH' does not match the required pattern"
            exit 1
          fi
          echo "✓ Source branch valid: $SOURCE_BRANCH"
